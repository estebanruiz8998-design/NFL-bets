e key number 3 in your pocket (home 3-point favorites cover only 45-47% ex-push across all weeks). The model rates the number fair (SEA by 3.1), so you are buying the better side of 3 at roughly market price with a chance the close lands at -3 flat and pays you a half point.", "risk": "Super Bowl losers are 6-18 ATS in their next Week 1 since 2002 (0-3 as dogs) \u2014 verified in nflverse, though it is another small post-hoc pattern \u2014 Week 1 road dogs at +3/+3.5 are 12-18-2 since 2014, and if the close is SEA -3.5 (-110) this ticket is simply the market price minus vig \u2014 three lenses called it zero expected CLV.", "evidence_grade": "D", "verification": "0/3 as an edge (0/3 for the SEA side, 0/3 for the teaser version); 1 of 3 lenses named it the acceptable NE ticket, and two lenses accepted it only at the stated price", "kickoff_iso": "2026-09-09T20:20:00-04:00"}], "week1": [{"rank": 1, "game": "DEN @ KC (Arrowhead, MNF)", "date": "Mon 9/14", "kickoff": "8:15pm ET", "bet": "DEN +3", "market": "Spread", "price_now": "KC -3 (+100) / DEN +3 (-120) at the reference feed; DraftKings -3 (juice to be confirmed at bet time; DK also posts a 42.5 total there, not 43.5); FanDuel/BetMGM -2.5 (-115/-120)", "price_condition": "DEN +3 at -110 or better only (DraftKings or any book holding 3 at flat juice \u2014 confirm the juice at bet time). Never DEN +2.5 at any price, never +3 at -115 or worse. Do NOT also hold KC -3 or KC -2.5.", "stake_units": 0.25, "tier": "SMALL", "why": "The market's own moneyline (KC -148 / DEN +124) and prediction markets imply a fair spread near KC -2.5, not -3, so a book giving you the full 3 at -110 is selling the key number at a standard price while consensus sits at 2.5 \u2014 across all weeks since 2014, home favorites at exactly 3 have covered only 47% of decided games \u2014 42% of all games, with 11% pushes (the Week 1-only record at exactly -3 is 7-7-2), which makes the dog side roughly breakeven-plus at -110. Mahomes (nine months off c's 42-45.5 bucket (75-50), both flagged post-hoc \u2014 graded D accordingly", "kickoff_iso": "2026-09-13T13:00:00-04:00"}, {"rank": 3, "game": "CLE @ JAX (EverBank Stadium)", "date": "Sun 9/13", "kickoff": "1:00pm ET", "bet": "CLE +9", "market": "Spread", "price_now": "JAX -8.5 (-108/-112) consensus, ML -440/+340; at least one book reported at -9; a few laggards at -8", "price_condition": "Fill-if-found only: CLE +9 at -110 or better. Never CLE +8.5 at -112, never +8 at any price. If no book shows +9 on Sunday morning, no bet.", "stake_units": 0.25, "tier": "SMALL", "why": "No Week 1 favorite laying 7.5 or more has a supportive record (17-32 ATS all-time; home favorites at 7.5-9 are 2-8 since 2014), and Week 1 dogs of 8+ are 29-12, so the one thing the data clearly says on this game is do not lay Jacksonville. Taking +9 at the highest available number gives you both 7 and 8 and a full point over the consensus close if the line settles at 8.5.", "risk": "The line sat at -7.5 from July through Sept 4 and moved a full point to -8.5 this week on reported money-side flow toward Jacksonville, the model has JAX by 8.4 (fair), and within the 8+ dog record 10+ point dogs are 14-5 and 8-9.5 dogs 15-7, but the 7.5-9.5 band is neutral in expected margin.", "evidence_grade": "C", "verification": "1 of 3 lenses accepted CLE +8.5 (killed as an edge); CLE +9 (-110) was the corrected ticket named by 2 lenses; JAX -7.5 0/3", "kickoff_iso": "2026-09-13T13:00:00-04:00"}], "do_not_bet": [{"bet": "SEA -3.5 (the July slip's ticket), SEA -3 (-118/-120), SEA ML -170", "why": "Lays through or on the key number 3 for a side that covers 45-47% ex-push across all weeks; the only line movement this week has been toward New England; the champ-home-opener 9-3-1 is n=13 and not significant; model P(cover -3) 48%."}, {"bet": "NE +3 at -110, NE +2.5 at any price, NE ML +142", "why": "NE +3 at -110 is worse than market (+3 is +100 elsewhere); +2.5 loses the push protection on 3 that is the only structural argument for NE; ML needs 41.3% and road +3 dogs win outright 40%."}, {"bet": "Any 2-team 6-point teaser including NE +9 or +9.5 at -120 or worse", "why": "Teased W1 road dogs at 3-3.5 with total <=49 hit 62% since 2014 (18-11), below the 72-74% breakeven; -110 teasers from exactly +3 barely exist at mainstream books."}, {"bet": "JAX -8.5 / -9 / ML -440 (chasing the July JAX -7)", "why": "The slip's condition (-7 flat) was never met; -8.5 lays through 7 and 8 into a 40.5 total; W1 home favorites laying 7.5-9 are 2-8 since 2014."}, {"bet": "KC -3 at any price, KC -2.5 at -115 or worse", "why": "Across all weeks since 2014, home favorites at exactly 3 cover 47% of decided games (42% of all games, 11% pushes) (about -5% EV even at +100; W1-only at exactly -3 is 7-7-2); -2.5 is priced -115/-120 at the books that hang it; and it is the paired opposite of the DEN +3 ticket on this slip."}, {"bet": "DEN +2.5 at any price, DEN ML +124", "why": "+2.5 gives up the key number; +124 is 15-20 cents short of what a +3 dog is worth (~+140)."}, {"bet": "PHI -5.5 (the July slip's PHI target was -5 or shorter)", "why": "The July -4.5 entry is gone; the number moved a full point toward PHI while the total dropped 2 points, making a 5.5-point cover structurally harder; model says PHI by 5.5 (fair)."}, {"bet": "MIN -1.5 / MIN ML -125 / GB +1.5 (the slip's MIN +1.5 watch)", "why": "The line flipped to MIN -1.5 when Murray was named starter and Parsons went to PUP/IR; both are fully priced and the model has MIN by 1.5 (no gap)."}, {"bet": "SF +3.5 (-108) and LA -3.5 (-112) in Melbourne", "why": "Prior-year playoff road dogs at +2.5..+4 in W1 are 9-19-3 (dead since 2014); W1 road dogs at exactly +3.5 are 5-11 since 2014; neutral-site games are 33-33 ATS; the travel asymmetry has been public for a month with the line unmoved at -3.5. LA -3.5 lays through 3 on a side whose move ended in July."}, {"bet": "NYJ @ TEN Over 39.5 (the model's only LEAN, +0.009 EV)", "why": "A 0.4-point model/market gap is inside the ~6-point noise floor and the model's out-of-sample calibration slope is ~0; W1 overs are 45.9% since 2002 and only 38-58 (39.6%) since 2020, and reported sharp handle is on the Under. Do not scale the 0.1u paper ticket."}, {"bet": "The 15-game Week 1 unders basket", "why": "W1 unders 54.1% is p=0.12, mean total-minus-line is indistinguishable from zero, and the paper basket already shows -6.0 points of net negative CLV; fifteen units of vig against an anecdote."}, {"bet": "Under 44.5 WAS@PHI (-115) and Under 47.5 BAL@IND", "why": "These are the two largest under moves on the board (each down 2 points); the July numbers that carried +2 CLV are gone and you would be chasing at a worse number and juice."}, {"bet": "TB @ CIN Under 50.5 or Over 50.5", "why": "Totals of 50+ in Week 1 are 13-17 for the under (the one bucket where the W1 under lean reverses); model total 50.4 is fair; no ticket either way."}, {"bet": "ARI +10 (-115) / LAC -10", "why": "The model's July gap (4.6 pts) has closed to 0.2; ARI +10 is juiced and Arizona starts Jacoby Brissett with rookie RB Jeremiyah Love in a tandem (confirmed Sept 8); LAC -10 lays through 7 and 10."}, {"bet": "Road-favorite fades or moneylines: BAL -3.5, BUF -1.5, CHI -3, DAL -3 and NYG ML +136, IND ML +145, CAR ML +130, HOU ML -105", "why": "W1 road favorites at -1.5..-3.5 are 40-36 ATS (p=1.00 vs breakeven); the dog moneylines are all priced 10-20 cents below their spread equivalents, so if you back any of these dogs, the spread is the better ticket."}, {"bet": "NO +7 / DET -7", "why": "W1 home favorites at 6.5-7.5: dog 22-19 (p=0.88 vs breakeven); the qualifier the slip implied (playoff home vs non-playoff road) does not appear to apply \u2014 Detroit went 9-8 in 2025 and missed the playoffs (nflverse). Nothing either way; CLV on the July NO +7 is 0."}, {"bet": "Any first-half, alt-spread or derivative on NE@SEA, and any stake above 0.25u on any ticket this week", "why": "Derivatives of a number every tool calls fair, sold at higher hold; and no component has demonstrated edge vs closing lines, so minimum stakes are the only defensible sizing."}], "total_units": 1.25, "timing_rules": ["Opener (Wed 9/9): shop the total first thing Wednesday morning \u2014 if any book still hangs 45.5, take Under 45.5 (-110) there and skip 44.5 entirely. Otherwise bet Under 44.5 only at -112 or better (the reference feed's -112 qualifies; DraftKings' -115 does not); if the number is 44 or lower, or 44.5 is -115 or worse everywhere, the bet is off. The final practice report is already out (Henderson OUT and Brown OUT are already assumed on the NE side; Seattle's safety status is Okada DNP / Emmanwori limited); re-check the game-day inactives (~6:50pm ET Wednesday) \u2014 the ticket survives either way, but do not add to it.", "Opener spread: NE +3.5 is a bet only at -115 or better (DraftKings today); NE +3 only at +100 or better. If every major book converges on SEA -3.5 (-110), or any book shows SEA -3 at -110 flat, the price play is dead \u2014 do not chase NE +3 at -110 and never take +2.5. Never hold any SEA ticket alongside it.", "DEN +3: bet it as soon as you find +3 at -110 (DraftKings shows -3 today; confirm its juice at bet time), not later \u2014 if Mahomes is downgraded the line moves toward Denver and +3 disappears, and if he is cleared the number goes to -3 -110/-3.5 anyway. Never +2.5, never +3 at -115 or worse, and do not pair it with any KC ticket.", "Sunday totals and dogs: place BUF@HOU Under 44.5 (1:00pm ET kickoff) by Saturday at -110 or better (no bet at 44 or lower or at -115). CLE +9 is fill-if-found only on Sunday morning at -110 or better; if the best number on the street is +8.5 you have no bet on that game. If Josh Hines-Allen is ruled out for JAX, expect the line to drop and the +9 to vanish \u2014 that is fine, pass.", "Book-level rule: 1u = 1% of bankroll, no ticket above 0.25u, total exposure this week 1.25u. Log every fill against the closing line function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtU(u) { return (Math.round(u * 100) / 100).toFixed(2).replace(/\.?0+$/, "") + "u"; }
function kickoffState(iso, now) {
  if (!iso) return { label: "", started: false };
  const t = new Date(iso).getTime(); const d = t - now;
  if (d <= 0) return { label: "started", started: true };
  const h = Math.floor(d / 36e5), m = Math.floor((d % 36e5) / 6e4);
  return { label: h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${m}m`, started: false };
}
function fmtKick(iso, fallback) {
  if (!iso) return esc(fallback || "");
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
  } catch (e) { return esc(fallback || ""); }
}

function renderPlay(p, now) {
  const ks = kickoffState(p.kickoff_iso, now);
  return `<div class="play">
    <div class="play-top">
      <span class="rank">${p.rank ? "#" + p.rank : ""}</span>
      <span class="game">${esc(p.game)}<small>${fmtKick(p.kickoff_iso, p.kickoff || p.date)}</small></span>
      <span class="chips">
        ${ks.started ? '<span class="chip started">started</span>' : ""}
        <span class="chip ${esc(p.tier)}">${esc(p.tier)}</span>
        <span class="chip grade ${esc(p.evidence_grade)}">evidence ${esc(p.evidence_grade)}</span>
      </span>
    </div>
    <div class="line">
      <div class="bet"><span class="mkt">${esc(p.market)}</span>${esc(p.bet)}</div>
      <div class="stake"><div class="u">${fmtU(p.stake_units)}</div><div class="k">stake</div></div>
    </div>
    <div class="cond">
      <span class="k">Now</span><span class="v">${esc(p.price_now)}</span>
      <span class="k">Only if</span><span class="v">${esc(p.price_condition)}</span>
    </div>
    <p class="why"><b>Why</b>${esc(p.why)}</p>
    <p class="risk"><b>Risk</b>${esc(p.risk)}</p>
    <div class="meta">verification: <span class="v">${esc(p.verification)}</span></div>
  </div>`;
}

function renderTicket(title, dateLabel, plays, now) {
  if (!plays.length) return "";
  const units = plays.reduce((s, p) => s + (p.stake_units || 0), 0);
  return `<div class="ticket">
    <div class="ticket-head"><span class="t">${esc(title)}</span><span class="d">${esc(dateLabel)}</span></div>
    ${plays.map(p => renderPlay(p, now)).join("")}
    <div class="stub"><span>plays <b>${plays.length}</b></span><span>stake <b>${fmtU(units)}</b></span><span class="serial">${esc(SLIP.serial || "")}</span></div>
  </div>`;
}

function render() {
  const now = Date.now();
  document.getElementById("banner").textContent = SLIP.banner;
  document.getElementById("eyebrow").textContent = SLIP.eyebrow;
  document.getElementById("title").textContent = SLIP.title;
  document.getElementById("sub").textContent = SLIP.sub;
  document.getElementById("headline").textContent = SLIP.headline;
  document.getElementById("honesty").textContent = SLIP.honesty_note;
  document.getElementById("tomorrow").innerHTML = renderTicket("Tomorrow — season opener", SLIP.tomorrow_label, SLIP.tomorrow, now);
  document.getElementById("week1").innerHTML = renderTicket("Rest of Week 1", SLIP.week1_label, SLIP.week1, now);
  document.getElementById("avoid").innerHTML = SLIP.do_not_bet.map(a => `<div><span class="b">${esc(a.bet)}</span><span class="w">${esc(a.why)}</span></div>`).join("");
  document.getElementById("rules").innerHTML = SLIP.timing_rules.map(r => `<li>${esc(r)}</li>`).join("");
  const total = [...SLIP.tomorrow, ...SLIP.week1].reduce((s, p) => s + (p.stake_units || 0), 0);
  document.getElementById("foot").innerHTML = `<b>Total exposure ${fmtU(total)}</b> (1u = 1% of bankroll). ${esc(SLIP.foot)}
    <br><br>If it stops being fun: <b>1-800-GAMBLER</b>.`;
}

function tick() {
  const el = document.getElementById("countdown");
  const now = Date.now();
  const next = [...SLIP.tomorrow, ...SLIP.week1].map(p => p.kickoff_iso).filter(Boolean)
    .map(iso => new Date(iso).getTime()).filter(t => t > now).sort((a, b) => a - b)[0];
  if (!next) { el.innerHTML = "Week 1 <b>underway</b>"; return; }
  const ks = kickoffState(new Date(next).toISOString(), now);
  const first = new Date(SLIP.tomorrow[0]?.kickoff_iso || next).getTime();
  el.innerHTML = (next === first ? "Kickoff in " : "Next kickoff in ") + `<b>${ks.label}</b>`;
}

render(); tick(); setInterval(tick, 30000);
</script>
